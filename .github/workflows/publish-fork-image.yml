name: Publish fork image

on:
  push:
    branches: [fix/release-3.8.53-provider-display]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-image
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/omniroute:fix-release-3.8.53-provider-display-${{ matrix.arch }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          cache-from: type=gha,scope=omniroute-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=omniroute-${{ matrix.arch }}

  publish:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest list
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/omniroute:fix-release-3.8.53-provider-display \
            ghcr.io/${{ github.repository_owner }}/omniroute:fix-release-3.8.53-provider-display-amd64 \
            ghcr.io/${{ github.repository_owner }}/omniroute:fix-release-3.8.53-provider-display-arm64
      - name: Inspect published image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/omniroute:fix-release-3.8.53-provider-display
