name: Publish fork image

on:
  push:
    branches: [fix/release-3.8.53-provider-display]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/omniroute:fix-release-3.8.53-provider-display
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          cache-from: type=gha
          cache-to: type=gha,mode=max
